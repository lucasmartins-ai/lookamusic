name: tauri-release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Project build runtime (package.json engines: >=20).
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm ci

      # Fail fast instead of publishing a release whose manifest version does
      # not match the tag (which would silently make the app report "up to
      # date" forever). package.json + tauri.conf.json must equal the tag.
      - name: Verify tag matches app version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG tauri.conf=$CONF package=$PKG"
          if [ "v$CONF" != "$TAG" ] || [ "$PKG" != "$CONF" ]; then
            echo "::error::Version mismatch — tag '$TAG', tauri.conf.json '$CONF', package.json '$PKG'. Bump all of them (and Cargo.toml/Cargo.lock) before tagging."
            exit 1
          fi

      - name: Build + publish draft release with updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Private key CONTENT (not path): the bundle signer ignores _PATH.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Key has no password; empty string skips the TTY prompt non-interactively.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LookaMusic ${{ github.ref_name }}"
          releaseBody: |
            LookaMusic ${{ github.ref_name }} — auto-update build (macOS / Windows / Linux).

            - The desktop app updates itself: **BUSCAR ATUALIZAÇÃO** → **ATUALIZAR**. It reads the signed manifest at `releases/latest/download/latest.json`.
            - Web/PWA: nothing to install — just reload the page.
            - Full history: see `CHANGELOG.md` in the repository.
            - macOS first launch without an Apple signature: right-click → Open.
          # false = publicado na hora: o endpoint releases/latest/download/latest.json
          # só serve releases PUBLICADOS (draft dá 404 e o app nunca vê update).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
